/* ---------- date helpers ---------- */
const DAY = 86400000;
function startOfToday() { const d = new Date(); d.setHours(0,0,0,0); return d; }
function nextOccurrence(month, day, from = startOfToday()) {
  // month: 1-12, day: 1-31
  const y = from.getFullYear();
  let d = new Date(y, month - 1, day, 0, 0, 0, 0);
  if (d < from) d = new Date(y + 1, month - 1, day, 0, 0, 0, 0);
  return d;
}
function daysUntil(date, from = startOfToday()) {
  return Math.round((date.getTime() - from.getTime()) / DAY);
}
function ordinalYears(originalYear, onDate) {
  if (!originalYear) return null;
  return onDate.getFullYear() - originalYear;
}
function ordinal(n) {
  const s = ["th","st","nd","rd"], v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}
function relDay(n) {
  if (n === 0) return "Today";
  if (n === 1) return "Tomorrow";
  return n + " days";
}
function fmtDate(date) { return MONTHS[date.getMonth()] + " " + date.getDate(); }

/* ---------- seed data ---------- */

// helpers to spread demo occasions across the coming weeks from "today"
function nearMonth(offsetDays) { const d = new Date(startOfToday().getTime() + offsetDays * DAY); return d.getMonth() + 1; }
function nearDay(offsetDays)   { const d = new Date(startOfToday().getTime() + offsetDays * DAY); return d.getDate(); }

/* ---------- store ---------- */
const KEY = "nevermiss.v3";
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { const d = JSON.parse(raw); if (d && d.version === 3) return d; }
  } catch (e) {}
  return seed();
}
function save(state) { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

function reducer(state, action) {
  switch (action.type) {
    case "ADD_PERSON": {
      const people = [...state.people, action.person];
      const occasions = action.occasion ? [...state.occasions, action.occasion] : state.occasions;
      return { ...state, people, occasions };
    }
    case "UPDATE_ME": return { ...state, me: { ...state.me, ...action.patch } };
    case "ADD_OCCASION": return { ...state, occasions: [...state.occasions, action.occasion] };
    case "DELETE_OCCASION": return { ...state, occasions: state.occasions.filter(o => o.id !== action.id) };
    case "ADD_WISH": return { ...state, wishes: [...state.wishes, action.wish] };
    case "DELETE_WISH": return { ...state, wishes: state.wishes.filter(w => w.id !== action.id) };
    case "CLAIM": return { ...state, wishes: state.wishes.map(w => w.id === action.id ? { ...w, claimedBy: action.by } : w) };
    case "MARK_SENT": return { ...state, sent: { ...state.sent, [action.id]: new Date().toISOString() } };
    case "SET_THEME": return { ...state, theme: action.theme };
    case "RESET": return seed();
    default: return state;
  }
}

/* ---------- confetti ---------- */
function fireConfetti(power = 1) {
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const canvas = document.getElementById("confetti");
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const colors = ["#E23E6B","#E39316","#1FA98C","#7B5BE0","#FF7A9C","#F4B24C"];
  const cx = window.innerWidth / 2, cy = window.innerHeight * 0.34;
  const N = Math.round(90 * power);
  const parts = Array.from({ length: N }, () => {
    const a = Math.random() * Math.PI * 2;
    const sp = 4 + Math.random() * 9;
    return {
      x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 3,
      g: 0.16 + Math.random() * 0.12, s: 5 + Math.random() * 6,
      rot: Math.random() * Math.PI, vr: (Math.random() - .5) * .3,
      c: colors[(Math.random() * colors.length) | 0], life: 0, max: 60 + Math.random() * 40,
    };
  });
  let raf;
  function tick() {
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    let alive = false;
    for (const p of parts) {
      if (p.life > p.max) continue;
      alive = true;
      p.life++; p.vy += p.g; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      const alpha = Math.max(0, 1 - p.life / p.max);
      ctx.save(); ctx.globalAlpha = alpha; ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.6); ctx.restore();
    }
    if (alive) raf = requestAnimationFrame(tick);
    else ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
  }
  cancelAnimationFrame(raf); tick();
}

/* ---------- primitives ---------- */
function Avatar({ person, size = 44 }) {
  const s = { width: size, height: size, background: `color-mix(in srgb, ${person.color} 20%, var(--surface))`,
    borderColor: `color-mix(in srgb, ${person.color} 45%, transparent)` };
  return (
    <div className="rounded-full grid place-items-center border shrink-0 select-none"
      style={s} aria-hidden="true">
      <span style={{ fontSize: size * 0.5, lineHeight: 1 }}>{person.emoji}</span>
    </div>
  );
}

function Button({ children, onClick, variant = "primary", size = "md", className = "", ...rest }) {
  const base = "inline-flex items-center justify-center gap-1.5 font-semibold rounded-full transition active:scale-[.97] disabled:opacity-40 disabled:active:scale-100";
  const sizes = { sm: "text-[13px] px-3 py-1.5", md: "text-sm px-4 py-2.5", lg: "text-[15px] px-5 py-3 w-full" };
  const variants = {
    primary: "bg-brand text-white shadow-[0_6px_16px_-6px_var(--brand)] hover:bg-brandstrong",
    soft: "bg-surface2 text-ink hover:brightness-[.98]",
    outline: "border border-line text-ink hover:bg-surface2",
    ghost: "text-inksoft hover:text-ink hover:bg-surface2",
    mint: "text-white shadow-[0_6px_16px_-6px_var(--mint)]",
  };
  const style = variant === "mint" ? { background: "var(--mint)" } : undefined;
  return (
    <button onClick={onClick} className={`${base} ${sizes[size]} ${variants[variant]} ${className}`} style={style} {...rest}>
      {children}
    </button>
  );
}

function Chip({ children, tone = "muted", className = "" }) {
  const tones = {
    muted: "bg-surface2 text-inksoft",
    brand: "text-brand",
    gold:  "text-gold",
    mint:  "text-mint",
    crit:  "text-crit",
  };
  const bg = { brand: "color-mix(in srgb, var(--brand) 14%, transparent)",
    gold: "color-mix(in srgb, var(--gold) 16%, transparent)",
    mint: "color-mix(in srgb, var(--mint) 15%, transparent)",
    crit: "color-mix(in srgb, var(--crit) 14%, transparent)" }[tone];
  return (
    <span className={`inline-flex items-center gap-1 text-[11.5px] font-bold uppercase tracking-wide px-2 py-1 rounded-full ${tones[tone]} ${className}`}
      style={bg ? { background: bg } : undefined}>
      {children}
    </span>
  );
}

/* Bottom sheet / modal */
function Sheet({ open, onClose, title, children, footer }) {
  useEffect(() => {
    if (!open) return;
    const onKey = (e) => { if (e.key === "Escape") onClose(); };
    document.addEventListener("keydown", onKey);
    document.body.style.overflow = "hidden";
    return () => { document.removeEventListener("keydown", onKey); document.body.style.overflow = ""; };
  }, [open, onClose]);
  if (!open) return null;
  return (

/* ---------- derived selectors ---------- */
function useUpcoming(state) {
  return useMemo(() => {
    const byId = Object.fromEntries([state.me, ...state.people].map(p => [p.id, p]));
    return state.occasions
      .map(o => {
        const date = nextOccurrence(o.month, o.day);
        return { ...o, date, days: daysUntil(date), person: byId[o.personId] || state.me,
          years: ordinalYears(o.year, date) };
      })
      .filter(o => o.person)
      .sort((a, b) => a.days - b.days);
  }, [state]);
}

/* ---------- HOME ---------- */
function HomeScreen({ upcoming, state, dispatch, onOpenPerson, onMessage, notify }) {
  const next = upcoming[0];
  const rest = upcoming.slice(1);
  const groups = groupByHorizon(rest);

  return (
    <div className="px-4 pb-28 pt-4 anim-fade">
      {next ? <HeroCountdown o={next} onOpenPerson={onOpenPerson} onMessage={onMessage} /> :
        <EmptyHint text="No occasions yet. Add someone in your circle to get started." />}

      {groups.map(g => g.items.length > 0 && (
        <section key={g.key} className="mt-6">
          <div className="flex items-baseline justify-between px-1 mb-2">
            <h3 className="font-display text-[17px] font-semibold">{g.label}</h3>
            <span className="text-xs text-muted font-semibold">{g.items.length}</span>
          </div>
          <div className="space-y-2.5">
            {g.items.map(o => (
              <OccasionCard key={o.id} o={o} onOpenPerson={onOpenPerson} onMessage={onMessage}
                sent={!!state.sent[o.id]} />
            ))}
          </div>
        </section>
      ))}
      <div className="text-center text-xs text-muted mt-8 px-6">
        You're keeping {state.people.length + 1} people close and {state.occasions.length} moments in view. 💛
      </div>
    </div>
  );
}

function groupByHorizon(list) {
  const G = { week: [], month: [], later: [] };
  for (const o of list) {
    if (o.days <= 7) G.week.push(o);
    else if (o.days <= 31) G.month.push(o);
    else G.later.push(o);
  }
  return [
    { key: "week", label: "This week", items: G.week },
    { key: "month", label: "This month", items: G.month },
    { key: "later", label: "Coming up", items: G.later },
  ];
}

function HeroCountdown({ o, onOpenPerson, onMessage }) {
  const t = OCCASION_TYPES[o.type];
  const isSoon = o.days <= 3;
  const fired = useRef(false);
  useEffect(() => { if (isSoon && !fired.current) { fired.current = true; const id = setTimeout(() => fireConfetti(1), 350); return () => clearTimeout(id); } }, [isSoon]);

  // progress: how far into the ~365-day cycle (closer = fuller)
  const pct = Math.max(0.04, 1 - Math.min(o.days, 365) / 365);
  const R = 52, C = 2 * Math.PI * R;

  return (
    <div className="relative overflow-hidden rounded-3xl p-5 text-white shadow-card anim-rise"
      style={{ background: `linear-gradient(135deg, var(--brand), ${o.type === "holiday" || o.type === "wedding" ? "var(--gold)" : "var(--brand-strong)"})` }}>
      <div className="absolute -top-10 -right-8 w-40 h-40 rounded-full opacity-20" style={{ background: "radial-gradient(circle,#fff,transparent 70%)" }} />
      <div className="flex items-center gap-1.5 mb-3">
        <Icon d={I.spark} size={16} />
        <span className="text-[11.5px] font-bold uppercase tracking-widest opacity-90">Next up</span>
      </div>
      <div className="flex items-center gap-4">
        <div className="relative shrink-0" style={{ width: 124, height: 124 }}>
          <svg width="124" height="124" viewBox="0 0 124 124" className="rotate-[-90deg]">
            <circle cx="62" cy="62" r={R} fill="none" stroke="rgba(255,255,255,.25)" strokeWidth="8" />
            <circle cx="62" cy="62" r={R} fill="none" stroke="#fff" strokeWidth="8" strokeLinecap="round"
              strokeDasharray={C} strokeDashoffset={C * (1 - pct)} style={{ transition: "stroke-dashoffset 1s ease" }} />
          </svg>
          <div className="absolute inset-0 grid place-items-center text-center">
            <div>
              <div className="font-display font-semibold leading-none tnum" style={{ fontSize: o.days === 0 ? 26 : 40 }}>
                {o.days === 0 ? "Today" : o.days}
              </div>
              {o.days > 0 && <div className="text-[10.5px] font-bold uppercase tracking-wider opacity-85 mt-1">{o.days === 1 ? "day" : "days"}</div>}
            </div>
          </div>
        </div>
        <div className="min-w-0">
          <div className="text-2xl leading-none mb-1">{t.emoji}</div>
          <h2 className="font-display text-2xl font-semibold leading-tight text-balance">{o.title}</h2>
          <button onClick={() => onOpenPerson(o.person.id)} className="text-sm opacity-90 mt-1 underline decoration-white/40 underline-offset-2">
            {o.person.name}{o.years != null && o.type === "birthday" ? ` · turning ${o.years}` : o.years != null && o.type === "anniversary" ? ` · ${ordinal(o.years)}` : ""}
          </button>
          <div className="text-[13px] opacity-85 mt-1.5 flex items-center gap-1.5">
            <Icon d={I.cal} size={14} /> {fmtDate(o.date)} · {relDay(o.days)}
          </div>
        </div>
      </div>
      <div className="flex gap-2 mt-4">
        <button onClick={() => onMessage(o)} className="flex-1 bg-white/95 text-brand font-bold text-sm rounded-full py-2.5 active:scale-[.97] transition">
          Say something
        </button>
        <button onClick={() => onOpenPerson(o.person.id)} className="flex-1 bg-white/15 border border-white/30 text-white font-bold text-sm rounded-full py-2.5 active:scale-[.97] transition">
          Gift ideas
        </button>
      </div>
    </div>
  );
}

function OccasionCard({ o, onOpenPerson, onMessage, sent }) {
  const t = OCCASION_TYPES[o.type];
  const tone = o.days <= 3 ? "crit" : o.days <= 7 ? "brand" : "muted";
  return (
    <div className="bg-surface border border-line rounded-2xl p-3 flex items-center gap-3 shadow-card">

      <div className="min-w-0 flex-1">
        <div className="flex items-center gap-1.5">

          <h4 className="font-semibold text-[15px] truncate">{o.title}</h4>

        <div className="text-[12.5px] text-inksoft mt-0.5 flex items-center gap-2">
          <span>{fmtDate(o.date)}</span>
          {o.years != null && o.type === "birthday" && <span className="text-muted">· turns {o.years}</span>}
          {o.years != null && o.type === "anniversary" && <span className="text-muted">· {ordinal(o.years)}</span>}

}

    const m = {};

  }, [upcoming]);
  const people = state.people.filter(p => filter === "All" || p.circle === filter);

  return (
    <div className="px-4 pb-28 pt-4 anim-fade">
      <div className="flex gap-2 mb-4 overflow-x-auto no-scrollbar -mx-1 px-1">
        {["All", ...CIRCLES].map(c => {
          const active = filter === c;

/* ---------- GIFTS ---------- */

function ThemeToggle({ theme, setTheme }) {
  const order = ["system", "light", "dark"];
  const labels = { system: "Auto theme", light: "Light", dark: "Dark" };
  const next = order[(order.indexOf(theme) + 1) % order.length];
  return <button onClick={() => setTheme(next)} className="font-semibold hover:text-ink">{labels[theme]}</button>;
}

/* ---------- PERSON DETAIL ---------- */

            <p className="text-[13px] opacity-90">{person.relationship} · {person.circle}</p>

        </div>

        <div className="flex-1 overflow-y-auto no-scrollbar px-4 py-5">

  const [emoji, setEmoji] = useState("🦊");

/* ---------- message drafts ---------- */
function MessageSheet({ occasion, onClose, onSent, notify }) {
  const person = occasion.person;
  const templates = MESSAGE_TEMPLATES[occasion.type] || MESSAGE_TEMPLATES.custom;
  const [text, setText] = useState(templates[0].replace(/\{name\}/g, person.name));
  const [idx, setIdx] = useState(0);

  function pick(i) { setIdx(i); setText(templates[i].replace(/\{name\}/g, person.name)); }
  async function copy() {
    try { await navigator.clipboard.writeText(text); notify("Copied to clipboard", { emoji: "📋" }); }
    catch (e) { notify("Select and copy the message"); }
  }
  return (
    <Sheet open onClose={onClose} title={`Say happy ${OCCASION_TYPES[occasion.type].label.toLowerCase()}`}
      footer={
        <div className="flex gap-2">
          <Button variant="soft" onClick={copy} className="flex-1"><Icon d={I.copy} size={16} /> Copy</Button>
          <Button variant="primary" onClick={() => { onSent(occasion); onClose(); }} className="flex-1"><Icon d={I.check} size={16} /> Mark sent</Button>
        </div>
      }>
      <div className="flex items-center gap-3 mb-4">
        <Avatar person={person} size={44} />
        <div>
          <div className="font-semibold">{person.name}</div>
          <div className="text-[12.5px] text-muted">{OCCASION_TYPES[occasion.type].emoji} {occasion.title} · {relDay(occasion.days)}</div>
        </div>
      </div>
      <div className="text-[12px] font-bold uppercase tracking-wide text-muted mb-2">Suggestions</div>
      <div className="space-y-2 mb-4">
        {templates.map((t, i) => (
          <button key={i} onClick={() => pick(i)}
            className={`w-full text-left text-[13.5px] leading-snug p-3 rounded-xl border transition ${idx === i ? "border-brand bg-surface2" : "border-line hover:bg-surface2"}`}>
            {t.replace(/\{name\}/g, person.name)}
          </button>
        ))}
      </div>
      <Field label="Your message">
        <textarea value={text} onChange={e => setText(e.target.value)} rows={3} className={inputCls + " resize-none"} />
      </Field>
    </Sheet>
  );
}

/* ---------- share ---------- */
function encodeProfile(state) {
  const payload = {
    n: state.me.name, r: state.me.relationship, e: state.me.emoji, c: state.me.color,
    o: state.occasions.filter(o => o.personId === ME_ID).map(o => ({ t: o.title, ty: o.type, m: o.month, d: o.day, y: o.year })),
    w: state.wishes.filter(w => w.personId === ME_ID).map(w => ({ t: w.title, p: w.price, no: w.note })),
  };
  try { return btoa(unescape(encodeURIComponent(JSON.stringify(payload)))); } catch (e) { return ""; }
}
function decodeProfile(str) {
  try { return JSON.parse(decodeURIComponent(escape(atob(str)))); } catch (e) { return null; }
}
function usePublicProfile() {
  const [data] = useState(() => {
    const h = location.hash || "";
    if (h.startsWith("#p/")) return decodeProfile(h.slice(3));
    return null;
  });
  return data;
}

function ShareSheet({ state, onClose, notify }) {
  const link = useMemo(() => location.href.split("#")[0] + "#p/" + encodeProfile(state), [state]);
  async function copy() {
    try { await navigator.clipboard.writeText(link); notify("Link copied", { emoji: "🔗" }); }
    catch (e) { notify("Copy the link below"); }
  }
  async function share() {
    if (navigator.share) { try { await navigator.share({ title: "My NeverMiss profile", url: link }); } catch (e) {} }
    else copy();
  }
  return (
    <Sheet open onClose={onClose} title="Share your profile"
      footer={<Button variant="primary" size="lg" onClick={share}><Icon d={I.share} size={16} /> Share link</Button>}>
      <div className="text-center py-2">
        <div className="mx-auto w-16 h-16 rounded-2xl bg-brand text-white grid place-items-center mb-3 shadow-[0_10px_24px_-8px_var(--brand)]">
          <Icon d={I.link} size={28} />
        </div>
        <p className="text-[14px] text-inksoft leading-relaxed px-2">
          Send this to family and friends. They'll see your occasions and wishlist and can quietly claim gifts — so nobody forgets, and nobody doubles up.
        </p>
      </div>
      <div className="mt-4 bg-surface2 border border-line rounded-xl p-3 flex items-center gap-2">
        <div className="text-[12.5px] text-inksoft truncate flex-1 tnum">{link.replace(/^https?:\/\//, "")}</div>
        <button onClick={copy} className="shrink-0 text-brand font-bold text-[13px] flex items-center gap-1"><Icon d={I.copy} size={15} />Copy</button>
      </div>
      <p className="text-[11.5px] text-muted mt-3 text-center px-4">In this prototype the link carries a read-only snapshot of your profile. A shipping version would use secure private links.</p>
    </Sheet>
  );
}

/* ---------- public (shared) profile view ---------- */
function PublicProfile({ data, onClose }) {
  const person = { name: data.n || "Someone", relationship: data.r || "", emoji: data.e || "🎈", color: data.c || "#E23E6B", id: "shared" };
  const occasions = (data.o || []).map(o => {
    const date = nextOccurrence(o.m, o.d);
    return { title: o.t, type: o.ty, date, days: daysUntil(date), years: ordinalYears(o.y, date) };
  }).sort((a, b) => a.days - b.days);
  const wishes = data.w || [];
  const [claimed, setClaimed] = useState({});

  return (
    <div className="min-h-[100dvh] flex justify-center sm:py-6">
      <div className="w-full sm:max-w-[480px] bg-surface sm:rounded-[34px] sm:shadow-float overflow-hidden flex flex-col" style={{ minHeight: "100dvh" }}>
        <div className="px-5 pt-[max(20px,env(safe-area-inset-top))] pb-6 text-white text-center"
          style={{ background: `linear-gradient(150deg, ${person.color}, color-mix(in srgb, ${person.color} 55%, #000))` }}>
          <div className="text-[11px] font-bold uppercase tracking-widest opacity-80 mb-3">Shared via NeverMiss</div>
          <div className="mx-auto rounded-full grid place-items-center border-2 border-white/70 mb-3" style={{ width: 84, height: 84, background: "rgba(255,255,255,.18)" }}>
            <span style={{ fontSize: 40 }}>{person.emoji}</span>
          </div>
          <h1 className="font-display text-3xl font-semibold">{person.name}</h1>
          {person.relationship && <p className="opacity-90 text-sm mt-1">{person.relationship}</p>}
        </div>
        <div className="flex-1 px-4 py-5">
          <SectionLabel icon={I.cake} tone="brand">Occasions</SectionLabel>
          <div className="space-y-2 mt-2 mb-6">
            {occasions.length === 0 && <EmptyHint text="No occasions shared." />}
            {occasions.map((o, i) => (
              <div key={i} className="bg-surface border border-line rounded-2xl p-3 flex items-center gap-3 shadow-card">
                <span className="text-xl">{(OCCASION_TYPES[o.type] || OCCASION_TYPES.custom).emoji}</span>
                <div className="flex-1 min-w-0">
                  <div className="font-semibold text-[14.5px] truncate">{o.title}</div>
                  <div className="text-[12.5px] text-muted">{fmtDate(o.date)}{o.years != null && o.type === "birthday" ? ` · turning ${o.years}` : ""}</div>
                </div>
                <Chip tone={o.days <= 7 ? "brand" : "muted"}>{relDay(o.days)}</Chip>
              </div>
            ))}
          </div>

          <SectionLabel icon={I.gift} tone="gold">Wishlist</SectionLabel>
          <p className="text-[12px] text-muted px-1 mt-1 mb-2">Claim one so no one else does — {person.name} won't see who.</p>
          <div className="space-y-2">
            {wishes.length === 0 && <EmptyHint text="No wishlist shared." />}
            {wishes.map((w, i) => (
              <div key={i} className="bg-surface border border-line rounded-2xl p-3 flex items-center gap-3 shadow-card">
                <div className="w-10 h-10 rounded-xl grid place-items-center shrink-0" style={{ background: "color-mix(in srgb, var(--brand) 12%, transparent)" }}>
                  <Icon d={I.gift} size={19} className="text-brand" />
                </div>
                <div className="min-w-0 flex-1">
                  <div className="font-semibold text-[14.5px] truncate">{w.t}</div>
                  <div className="text-[12.5px] text-muted truncate">{w.p}{w.no ? ` · ${w.no}` : ""}</div>
                </div>
                {claimed[i]
                  ? <Chip tone="mint"><Icon d={I.check} size={11} stroke={2.6} />You've got this</Chip>
                  : <Button size="sm" variant="soft" onClick={() => { setClaimed(c => ({ ...c, [i]: true })); fireConfetti(0.5); }}>I'll get it</Button>}
              </div>
            ))}
          </div>

          <div className="mt-8 rounded-2xl border border-line p-4 text-center bg-surface2">
            <div className="font-display text-lg font-semibold mb-1">Never miss their day</div>
            <p className="text-[13px] text-muted mb-3">Get reminders for {person.name} and everyone you love.</p>
            <Button variant="primary" onClick={onClose}>Open my NeverMiss</Button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ---------- mount ---------- */
ReactDOM.createRoot(document.getElementById("root")).render(<App />);

/* Register the service worker so the app is installable + works offline —
   only when running as the top-level page over http(s) (skipped in sandboxed
   previews/iframes, where registration isn't allowed). */
if ("serviceWorker" in navigator && window.self === window.top &&
    (location.protocol === "https:" || location.hostname === "localhost")) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
